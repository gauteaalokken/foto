name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Caches the downloaded packages themselves (~/.npm), so the install
          # step doesn't re-fetch every package from the registry each build.
          cache: npm
      # `npm install`, not `npm ci`, on purpose. `npm ci` would be stricter, but
      # it refuses to run when the lockfile doesn't fully describe the platform
      # it's installing on — and this lockfile is written on a Mac while CI runs
      # on Linux, where sharp pulls in two packages (@emnapi/core, @emnapi/runtime)
      # that never appear in a macOS resolution. Tried on 2026-08-16: the build
      # failed in 9 seconds on exactly that. `npm install` fills the gap instead
      # of erroring, and still follows the lockfile for everything it does cover.
      # Worth revisiting only if the lockfile is ever regenerated on Linux.
      - run: npm install
      - uses: actions/cache@v4
        with:
          path: |
            node_modules/.astro
            node_modules/.image-staging
          key: image-cache-${{ github.run_id }}
          restore-keys: image-cache-
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
