backend:
  name: github
  repo: gauteaalokken/foto # MUST match your exact username/repository name on GitHub
  branch: main

media_libraries:
  default: false
  cloudflare_r2:
    bucket: foto-photos
    account_id: 1904e782382751217d6103b2d39a41da
    public_url: https://pub-3870a4bde8aa48ebb61d76487f736f57.r2.dev
    access_key_id: a74d879decb219fc298c10edd12ecda5

collections:
  - name: "homepageSettings"
    label: "Forside-innstillinger"
    files:
      - name: "main"
        label: "Forside-innstillinger"
        file: "src/content/homepageSettings/index.yml"
        fields:
          - label: "Type forside"
            name: "layout"
            widget: "select"
            default: "grid"
            required: false
            hint: "Bytt fritt mellom disse når som helst."
            options:
              - { label: "Rutenett med luft (tilfeldige tomme ruter mellom prosjektene)", value: "grid" }
              - { label: "Rutenett uten luft (prosjektene ligger tett etter hverandre)", value: "gridTight" }
              - { label: "Fullskjerm-scroll (ett prosjekt om gangen, glimt av neste)", value: "fullscreenScroll" }
              - { label: "Portefølje (gammel forside — rutenett med dine beste bilder, ikke knyttet til prosjekter)", value: "portfolioGrid" }

  - name: "projects"
    label: "Projects"
    folder: "src/content/projects"
    create: true
    extension: "yml"
    format: "yml"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "e.g. My Book Title" }
      - { label: "Year", name: "year", widget: "string", hint: "e.g. 2024 — shown under the cover on the homepage" }
      - { label: "Order", name: "order", widget: "number", required: false, hint: "Optional. Lower numbers show first on the homepage, overriding the year sort. Leave blank to just sort by year." }
      - label: "Cover"
        name: "cover"
        widget: "image"
        required: false
        hint: "Optional. Shown on the homepage instead of the first page below — pick any photo without having to reorder Pages."
        media_libraries:
          cloudflare_r2:
            bucket: foto-photos
            account_id: 1904e782382751217d6103b2d39a41da
            public_url: https://pub-3870a4bde8aa48ebb61d76487f736f57.r2.dev
            access_key_id: a74d879decb219fc298c10edd12ecda5
            prefix: "projects/"
      - label: "Pages"
        name: "pages"
        widget: "image"
        multiple: true
        hint: "Upload each page of the book, in order, as JPGs. The first page is used as the cover thumbnail on the homepage unless a Cover photo is set above."
        media_libraries:
          cloudflare_r2:
            bucket: foto-photos
            account_id: 1904e782382751217d6103b2d39a41da
            public_url: https://pub-3870a4bde8aa48ebb61d76487f736f57.r2.dev
            access_key_id: a74d879decb219fc298c10edd12ecda5
            prefix: "projects/"

  - name: "feed"
    label: "Feed"
    files:
      - name: "main"
        label: "Feed"
        file: "src/content/feed/index.yml"
        fields:
          - label: "Photos"
            name: "photos"
            widget: "image"
            multiple: true
            hint: "All your photos for the scrolling Feed page. You can keep adding more here over time — shown at lower quality for fast loading."
            media_libraries:
              cloudflare_r2:
                bucket: foto-photos
                account_id: 1904e782382751217d6103b2d39a41da
                public_url: https://pub-3870a4bde8aa48ebb61d76487f736f57.r2.dev
                access_key_id: a74d879decb219fc298c10edd12ecda5
                prefix: "feed/"

  - name: "portfolio"
    label: "Portfolio (for clients)"
    files:
      - name: "main"
        label: "Portfolio (for clients)"
        file: "src/content/portfolio/index.yml"
        fields:
          - label: "Show in navigation bar"
            name: "showInNav"
            widget: "boolean"
            default: false
            hint: "The page always exists at /portefolje regardless of this — turning this on just adds a 'Portefølje' link to the site navigation, e.g. when you want to send it to a potential client."
          - label: "Photos"
            name: "photos"
            widget: "image"
            multiple: true
            hint: "A curated set of photos for a classic full-portfolio page — separate from the project pages."
            media_libraries:
              cloudflare_r2:
                bucket: foto-photos
                account_id: 1904e782382751217d6103b2d39a41da
                public_url: https://pub-3870a4bde8aa48ebb61d76487f736f57.r2.dev
                access_key_id: a74d879decb219fc298c10edd12ecda5
                prefix: "portfolio/"

  - name: "fjellmaraton"
    label: "Flaksjøen Fjellmaraton"
    files:
      - name: "main"
        label: "Flaksjøen Fjellmaraton"
        file: "src/content/fjellmaraton/index.yml"
        fields:
          - label: "Bilder over skjemaet"
            name: "topPhotos"
            widget: "image"
            multiple: true
            required: false
            hint: "Vises øverst på siden, over påmeldingsskjemaet. Bildene legges på én rad ved siden av hverandre og beholder sine egne proporsjoner — 2-4 bilder passer best."
            media_libraries:
              cloudflare_r2:
                bucket: foto-photos
                account_id: 1904e782382751217d6103b2d39a41da
                public_url: https://pub-3870a4bde8aa48ebb61d76487f736f57.r2.dev
                access_key_id: a74d879decb219fc298c10edd12ecda5
                prefix: "fjellmaraton/"
          - label: "Photos"
            name: "photos"
            widget: "image"
            multiple: true
            hint: "Shown in the grid below the sign-up form on the Flaksjøen Fjellmaraton page."
            media_libraries:
              cloudflare_r2:
                bucket: foto-photos
                account_id: 1904e782382751217d6103b2d39a41da
                public_url: https://pub-3870a4bde8aa48ebb61d76487f736f57.r2.dev
                access_key_id: a74d879decb219fc298c10edd12ecda5
                prefix: "fjellmaraton/"

  - name: "blogSettings"
    label: "Blog settings"
    files:
      - name: "main"
        label: "Blog settings"
        file: "src/content/blogSettings/index.yml"
        fields:
          - label: "Show in navigation bar"
            name: "showInNav"
            widget: "boolean"
            default: false
            hint: "The blog always exists at /blogg regardless of this — turning this on just adds a 'Blogg' link to the site navigation."
          - { label: "Page title", name: "title", widget: "string", required: false, hint: "Optional. Defaults to 'Blogg' if left blank." }
          - { label: "Intro text", name: "intro", widget: "text", required: false, hint: "Optional short text shown at the top of the blog listing page." }
          - label: "Listing layout"
            name: "listingLayout"
            widget: "select"
            default: "grid"
            required: false
            hint: "How the blog front page shows your posts."
            options:
              - { label: "Grid (cards in columns)", value: "grid" }
              - { label: "Stacked (one post per row)", value: "stacked" }
              - { label: "Featured (newest post large, page through the rest)", value: "featured" }

  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    extension: "yml"
    format: "yml"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false }
      - label: "Cover"
        name: "cover"
        widget: "image"
        required: false
        hint: "Optional. Shown on the blog listing page — falls back to the first photo in the post below when unset."
        media_libraries:
          cloudflare_r2:
            bucket: foto-photos
            account_id: 1904e782382751217d6103b2d39a41da
            public_url: https://pub-3870a4bde8aa48ebb61d76487f736f57.r2.dev
            access_key_id: a74d879decb219fc298c10edd12ecda5
            prefix: "blog/"
      - label: "Open directly in lightbox view"
        name: "openInLightbox"
        widget: "boolean"
        default: false
        required: false
        hint: "When on, the post opens straight into the fullscreen photo viewer (starting at the first image) instead of the normal page layout."
      - label: "Content blocks"
        name: "blocks"
        widget: "list"
        hint: "Mix text and images freely, in any order — including image-only posts with no text blocks at all."
        types:
          - label: "Text"
            name: "text"
            widget: "object"
            fields:
              - { label: "Text", name: "text", widget: "markdown" }
          - label: "Single image"
            name: "image"
            widget: "object"
            fields:
              - label: "Image"
                name: "image"
                widget: "image"
                media_libraries:
                  cloudflare_r2:
                    bucket: foto-photos
                    account_id: 1904e782382751217d6103b2d39a41da
                    public_url: https://pub-3870a4bde8aa48ebb61d76487f736f57.r2.dev
                    access_key_id: a74d879decb219fc298c10edd12ecda5
                    prefix: "blog/"
              - { label: "Caption", name: "caption", widget: "string", required: false }
          - label: "Two images side by side"
            name: "image_pair"
            widget: "object"
            fields:
              - label: "Images"
                name: "images"
                widget: "image"
                multiple: true
                hint: "Exactly 2 images."
                media_libraries:
                  cloudflare_r2:
                    bucket: foto-photos
                    account_id: 1904e782382751217d6103b2d39a41da
                    public_url: https://pub-3870a4bde8aa48ebb61d76487f736f57.r2.dev
                    access_key_id: a74d879decb219fc298c10edd12ecda5
                    prefix: "blog/"
          - label: "Image gallery"
            name: "image_gallery"
            widget: "object"
            fields:
              - label: "Layout"
                name: "layout"
                widget: "select"
                default: "grid"
                hint: "Change this any time without having to re-add the photos below."
                options:
                  - { label: "Grid (uniform squares)", value: "grid" }
                  - { label: "Masonry (natural proportions, multi-column)", value: "masonry" }
                  - { label: "Dense (like Feed)", value: "feed" }
                  - { label: "Sideways scrolling carousel", value: "carousel" }
              - label: "Images"
                name: "images"
                widget: "image"
                multiple: true
                hint: "3 or more images work best."
                media_libraries:
                  cloudflare_r2:
                    bucket: foto-photos
                    account_id: 1904e782382751217d6103b2d39a41da
                    public_url: https://pub-3870a4bde8aa48ebb61d76487f736f57.r2.dev
                    access_key_id: a74d879decb219fc298c10edd12ecda5
                    prefix: "blog/"

  - name: "prints"
    label: "Prints"
    folder: "src/content/prints"
    create: true
    extension: "yml"
    format: "yml"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "e.g. Algorobo — becomes the page title and web address (/prints/algorobo)." }
      - label: "Photo"
        name: "photo"
        widget: "image"
        hint: "A photo of the framed print, or your own mockup — this is what shows on the Prints page and the print's own page."
        media_libraries:
          cloudflare_r2:
            bucket: foto-photos
            account_id: 1904e782382751217d6103b2d39a41da
            public_url: https://pub-3870a4bde8aa48ebb61d76487f736f57.r2.dev
            access_key_id: a74d879decb219fc298c10edd12ecda5
            prefix: "prints/"
