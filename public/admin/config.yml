backend:
  name: github
  repo: gauteaalokken/foto # MUST match your exact username/repository name on GitHub
  branch: main

media_libraries:
  default: false
  cloudflare_r2:
    bucket: foto-photos
    account_id: 1904e782382751217d6103b2d39a41da
    public_url: https://pub-3870a4bde8aa48ebb61d76487f736f57.r2.dev
    access_key_id: a74d879decb219fc298c10edd12ecda5

collections:
  - name: "projects"
    label: "Projects"
    folder: "src/content/projects"
    create: true
    extension: "yml"
    format: "yml"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "e.g. My Book Title" }
      - { label: "Year", name: "year", widget: "string", hint: "e.g. 2024 — shown under the cover on the homepage" }
      - label: "Pages"
        name: "pages"
        widget: "image"
        multiple: true
        hint: "Upload each page of the book, in order, as JPGs. The first page is used as the cover thumbnail on the homepage."
        media_libraries:
          cloudflare_r2:
            bucket: foto-photos
            account_id: 1904e782382751217d6103b2d39a41da
            public_url: https://pub-3870a4bde8aa48ebb61d76487f736f57.r2.dev
            access_key_id: a74d879decb219fc298c10edd12ecda5
            prefix: "projects/"

  - name: "gallery"
    label: "Portfolio (Homepage)"
    files:
      - name: "main"
        label: "Portfolio (Homepage)"
        file: "src/content/gallery/index.yml"
        fields:
          - label: "Photos"
            name: "photos"
            widget: "image"
            multiple: true
            hint: "These show on your homepage, in this order, at high quality. Keep this a small curated selection. Run 'npm run sort-feed color gallery' on your computer to automatically reorder them by color."
            media_libraries:
              cloudflare_r2:
                bucket: foto-photos
                account_id: 1904e782382751217d6103b2d39a41da
                public_url: https://pub-3870a4bde8aa48ebb61d76487f736f57.r2.dev
                access_key_id: a74d879decb219fc298c10edd12ecda5
                prefix: "homepage/"

  - name: "feed"
    label: "Feed"
    files:
      - name: "main"
        label: "Feed"
        file: "src/content/feed/index.yml"
        fields:
          - label: "Photos"
            name: "photos"
            widget: "image"
            multiple: true
            hint: "All your photos for the scrolling Feed page. You can keep adding more here over time — shown at lower quality for fast loading."
            media_libraries:
              cloudflare_r2:
                bucket: foto-photos
                account_id: 1904e782382751217d6103b2d39a41da
                public_url: https://pub-3870a4bde8aa48ebb61d76487f736f57.r2.dev
                access_key_id: a74d879decb219fc298c10edd12ecda5
                prefix: "feed/"

  - name: "fjellmaraton"
    label: "Flaksjøen Fjellmaraton"
    files:
      - name: "main"
        label: "Flaksjøen Fjellmaraton"
        file: "src/content/fjellmaraton/index.yml"
        fields:
          - label: "Photos"
            name: "photos"
            widget: "image"
            multiple: true
            hint: "Shown in the grid below the sign-up form on the Flaksjøen Fjellmaraton page."
            media_libraries:
              cloudflare_r2:
                bucket: foto-photos
                account_id: 1904e782382751217d6103b2d39a41da
                public_url: https://pub-3870a4bde8aa48ebb61d76487f736f57.r2.dev
                access_key_id: a74d879decb219fc298c10edd12ecda5
                prefix: "fjellmaraton/"

  - name: "prints"
    label: "Prints"
    folder: "src/content/prints"
    create: true
    extension: "yml"
    format: "yml"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "e.g. Algorobo — becomes the page title and web address (/prints/algorobo)." }
      - label: "Photo"
        name: "photo"
        widget: "image"
        hint: "A photo of the framed print, or your own mockup — this is what shows on the Prints page and the print's own page."
        media_libraries:
          cloudflare_r2:
            bucket: foto-photos
            account_id: 1904e782382751217d6103b2d39a41da
            public_url: https://pub-3870a4bde8aa48ebb61d76487f736f57.r2.dev
            access_key_id: a74d879decb219fc298c10edd12ecda5
            prefix: "prints/"

  - name: "blog"
    label: "Blog (ukens bilder)"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - label: "Photos"
        name: "photos"
        widget: "image"
        multiple: true
        media_libraries:
          cloudflare_r2:
            bucket: foto-photos
            account_id: 1904e782382751217d6103b2d39a41da
            public_url: https://pub-3870a4bde8aa48ebb61d76487f736f57.r2.dev
            access_key_id: a74d879decb219fc298c10edd12ecda5
            prefix: "blog/"
      - { label: "Text", name: "body", widget: "markdown" }
